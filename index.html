<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guten Morgen ☀️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  html{background:#232846}
  body.stage{width:60vh;margin:0 auto;position:relative;transform:translateZ(0);box-shadow:0 0 80px rgba(0,0,0,.45)}
  body{font-family:'Fredoka',system-ui,sans-serif;min-height:100dvh;touch-action:manipulation;
    user-select:none;-webkit-user-select:none;transition:background 1s}
  #scene{position:fixed;left:0;right:0;bottom:0;height:42vh;width:100%;z-index:1;overflow:visible}
  .particle{position:fixed;top:-30px;pointer-events:none;z-index:2;animation:fall linear infinite}
  @keyframes fall{to{transform:translateY(110vh) translateX(var(--drift,30px)) rotate(var(--rot,0deg))}}
  .cloud{position:fixed;z-index:0;background:#fff;border-radius:999px;opacity:.85;animation:drift linear infinite}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud::before{width:55%;height:160%;left:15%;bottom:20%}
  .cloud::after{width:40%;height:130%;right:12%;bottom:25%}
  @keyframes drift{from{transform:translateX(-40vw)}to{transform:translateX(140vw)}}

  #actor{position:fixed;left:0;top:0;will-change:transform;z-index:4}
  #body{width:var(--size);height:var(--size);transform-origin:50% 90%;transition:transform .12s ease-out}
  #body.squash{transform:scale(1.18,.8)}
  #body.stretch{transform:scale(.88,1.12)}
  #body.dance{animation:dance .5s ease-in-out 4}
  @keyframes dance{25%{transform:rotate(-14deg) translateX(-6px)}75%{transform:rotate(14deg) translateX(6px)}}
  .sun{width:100%;height:100%;display:block}
  .rays{transform-origin:100px 100px;animation:spin 14s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .eye{transform-box:fill-box;transform-origin:center;animation:blink 3.8s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

  #bubble{position:fixed;left:0;top:0;z-index:9;background:#fff;color:#4a2a14;border-radius:24px;
    padding:14px 18px;font-weight:600;font-size:1.2rem;line-height:1.25;text-align:center;
    box-shadow:0 8px 24px rgba(80,40,0,.18);max-width:82%;width:max-content;
    transform:scale(0);transform-origin:50% 100%;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
  #bubble.show{transform:scale(1)}
  #bubble::after{content:"";position:absolute;left:var(--tail,50%);bottom:-12px;transform:translateX(-50%);
    border:12px solid transparent;border-top-color:#fff;border-bottom:0}
  #bubble big{display:block;font-size:1.55rem;color:#e8780c}

  .spark{position:fixed;pointer-events:none;z-index:6;font-size:22px;animation:pop 1.1s ease-out forwards}
  @keyframes pop{to{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(var(--rot,0deg));opacity:0}}
  .tap{position:fixed;top:calc(16px + env(safe-area-inset-top));left:0;right:0;text-align:center;z-index:5;
    color:#5a3a2a;opacity:0;transition:opacity 1s;font-size:.95rem}
  .tap.show{opacity:.65}
  #bea{position:fixed;left:0;top:0;z-index:4;width:var(--beaw);height:var(--beah);will-change:transform}
  #bea svg{width:100%;height:100%;display:block;transform-origin:50% 100%}
  #bea.jump svg{animation:beajump .55s cubic-bezier(.3,1.4,.5,1)}
  @keyframes beajump{40%{transform:translateY(-24%) scale(.95,1.08)}80%{transform:scale(1.08,.92)}}
  .wave{transform-origin:86px 106px;animation:wave 1s ease-in-out infinite}
  @keyframes wave{50%{transform:rotate(-16deg)}}
  #dusk{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 2.6s;
    background:linear-gradient(180deg,rgba(255,140,90,.0) 0%,rgba(255,150,110,.35) 60%,rgba(255,120,120,.4) 100%)}
  #monster{position:fixed;left:0;top:0;z-index:4;width:var(--msize);height:var(--msize);will-change:transform;display:none}
  #monster svg{width:100%;height:100%;display:block;animation:grumble .5s ease-in-out infinite}
  @keyframes grumble{50%{transform:scale(1.04,.96) rotate(-2deg)}}
  #mbubble{position:fixed;z-index:5;background:#2d1f47;color:#fff;border-radius:18px;padding:10px 14px;font-weight:600;
    font-size:1.05rem;max-width:60vw;transform:scale(0);transform-origin:50% 100%;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
  #mbubble.show{transform:scale(1)}
  #mbubble::after{content:"";position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);border:10px solid transparent;border-top-color:#2d1f47;border-bottom:0}
  #fight{position:fixed;z-index:5;width:var(--fsize);height:var(--fsize);pointer-events:none;display:none}
  #fight .puff{position:absolute;border-radius:50%;background:#fff;box-shadow:inset -6px -8px 0 rgba(0,0,0,.08);animation:puff .35s ease-in-out infinite alternate}
  @keyframes puff{to{transform:scale(1.15) translate(4px,-3px)}}
  #fight .spin{position:absolute;inset:0;animation:fspin .6s linear infinite}
  @keyframes fspin{to{transform:rotate(360deg)}}
  .boom{position:fixed;z-index:6;pointer-events:none;font:900 2.1rem 'Fredoka',sans-serif;color:#e2483d;
    -webkit-text-stroke:2px #fff;paint-order:stroke;text-shadow:0 3px 0 #ffd84a;animation:boom .7s cubic-bezier(.3,1.6,.5,1) forwards}
  @keyframes boom{0%{transform:scale(0) rotate(var(--r))}50%{transform:scale(1.2) rotate(var(--r))}100%{transform:scale(1) rotate(var(--r));opacity:0}}
  .prop{position:fixed;left:0;top:0;transform-origin:50% 100%;pointer-events:none;will-change:transform}
  .prop svg{width:100%;height:100%;display:block;overflow:visible}
  .prop .emo{line-height:1;text-align:center;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center}
  .wink .winke-l{transform-origin:44px 52px;animation:winkl .5s ease-in-out infinite}
  .wink .winke-r{transform-origin:96px 52px;animation:winkr .5s ease-in-out infinite}
  @keyframes winkl{50%{transform:rotate(-25deg)}} @keyframes winkr{50%{transform:rotate(25deg)}}
  .dampfend .dampf{animation:dampf 1.4s ease-in-out infinite}
  @keyframes dampf{50%{transform:translateY(-4px);opacity:.4}}
  .schild{position:relative;width:100%;height:100%}
  .schild .brett{position:absolute;left:4%;right:4%;top:6%;height:52%;background:#8a542c;border:3px solid #6b3f20;border-radius:10px;color:#fff;
    font-weight:600;display:flex;align-items:center;justify-content:center;text-align:center;font-size:calc(var(--size)*.13);line-height:1.1;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
  .schild .etikett{position:absolute;left:2%;right:2%;top:4%;height:62%;background:#fffdf8;border:2px solid #e8dcc6;border-radius:4px;
    box-shadow:0 3px 8px rgba(90,60,20,.25);text-align:center;color:#2b2420;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Georgia,'Times New Roman',serif}
  .schild .est{font-size:calc(var(--size)*.055);letter-spacing:1px;color:#6b5e52}
  .schild .name{font-size:calc(var(--size)*.2);font-weight:700;line-height:1}
  .schild .linie{width:70%;height:1.5px;background:#2b2420;margin:3px 0}
  .schild .dorf{font-size:calc(var(--size)*.072);letter-spacing:1.5px;font-family:'Fredoka',sans-serif;font-weight:600}
  .schild .klein{font-size:calc(var(--size)*.045);color:#6b5e52;margin-top:2px}
  .schild .schleife{position:absolute;top:-8%;right:-4%;font-size:calc(var(--size)*.22);transform:rotate(15deg)}
  .banner{position:relative;width:100%;height:100%}
  .banner .seil{position:absolute;bottom:60%;width:2px;height:120vh;background:#a07a4a}
  .banner .seil.l{left:14%} .banner .seil.r{right:14%}
  .banner .etikett{position:absolute;inset:0;background:#fffdf8;border:3px solid #e8dcc6;border-radius:8px;box-shadow:0 8px 24px rgba(90,60,20,.28);
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:#2b2420;font-family:Georgia,'Times New Roman',serif;text-align:center}
  .banner .est{font-size:calc(var(--bw)*.045);letter-spacing:2px;color:#6b5e52}
  .banner .name{font-size:calc(var(--bw)*.17);font-weight:700;line-height:1}
  .banner .linie{width:72%;height:2px;background:#2b2420;margin:6px 0}
  .banner .dorf{font-size:calc(var(--bw)*.065);letter-spacing:3px;font-family:'Fredoka',sans-serif;font-weight:600}
  .banner .klein{font-size:calc(var(--bw)*.04);color:#6b5e52;margin-top:4px}
  .banner .schleife{position:absolute;top:-14%;right:-5%;font-size:calc(var(--bw)*.18);transform:rotate(15deg);z-index:2}
  .banner .lichter{position:absolute;left:-4%;right:-4%;top:-7%;height:14%;z-index:1;
    background:radial-gradient(circle,#fff3b0 0 3.5px,rgba(255,220,120,.6) 4.5px,transparent 8px) 0 50%/calc(var(--bw)*.09) 100% repeat-x;animation:birne 1.8s ease-in-out infinite}
  .schild .pfosten{position:absolute;bottom:0;width:7%;height:60%;background:#8a5a33;border-radius:3px}
  .schild .pfosten.l{left:18%} .schild .pfosten.r{right:18%}
  .schild .schneekappe{position:absolute;left:2%;right:2%;top:2%;height:12%;background:#fff;border-radius:12px}
  .stand{position:relative;width:100%;height:100%}
  .stand .markise{position:absolute;left:0;right:0;top:20%;height:20%;border-radius:8px 8px 14px 14px;
    background:repeating-linear-gradient(90deg,#e2483d 0 12%,#fff 12% 24%)}
  .stand .markise.gruen{background:repeating-linear-gradient(90deg,#3f9b6b 0 12%,#fff 12% 24%)}
  .stand .standschild{position:absolute;left:8%;right:8%;top:0;height:20%;background:#fff6e6;border:2px solid #8a542c;border-radius:8px;color:#8a542c;
    font-weight:600;font-size:calc(var(--size)*.085);display:flex;align-items:center;justify-content:center;text-align:center;transition:transform .35s}
  .stand .standschild.dreh{transform:rotateX(360deg)} .stand .standschild.rot{color:#fff;background:#e2483d;border-color:#a92a2a}
  .stand .theke{position:absolute;left:4%;right:4%;bottom:0;height:52%;background:linear-gradient(#c8924f,#a8693a);border-radius:6px;border-top:6px solid #8a542c}
  .vorhang{position:relative;width:100%;height:100%}
  .vorhang .stange{position:absolute;top:0;left:-4%;right:-4%;height:5%;background:#d4a017;border-radius:4px}
  .vorhang .tuch{position:absolute;top:4%;bottom:0;left:0;right:0;border-radius:0 0 10px 10px;
    background:repeating-linear-gradient(90deg,#b3202a 0 10%,#d6333d 10% 20%)}
  .laufsteg{width:100%;height:100%;background:linear-gradient(#f1d27a,#d4a017);border-radius:6px}
  .werkbank{position:relative;width:100%;height:100%}
  .werkbank .platte{position:absolute;top:30%;left:0;right:0;height:16%;background:#a8693a;border-radius:4px}
  .werkbank .bein{position:absolute;top:44%;bottom:0;width:9%;background:#8a542c} .werkbank .bein.l{left:8%} .werkbank .bein.r{right:8%}
  .werkbank .werkzeug{position:absolute;top:0;left:0;right:0;text-align:center;font-size:calc(var(--size)*.16)}
  .schaum{position:fixed;left:0;right:0;bottom:0;height:0;z-index:6;pointer-events:none;transition:height 1.4s ease-out;
    background:radial-gradient(circle at 10% 20%,#fff 0 18px,transparent 19px),radial-gradient(circle at 30% 10%,#fff 0 24px,transparent 25px),
    radial-gradient(circle at 55% 18%,#fff 0 20px,transparent 21px),radial-gradient(circle at 78% 8%,#fff 0 26px,transparent 27px),
    radial-gradient(circle at 92% 22%,#fff 0 18px,transparent 19px),linear-gradient(transparent 22px,#fff 22px);
    filter:drop-shadow(0 -2px 3px rgba(120,160,200,.35))}
  .fenster{position:fixed;z-index:0;top:12%;right:8%;width:30vw;height:24vw;max-width:220px;max-height:176px;border:8px solid #fff;border-radius:6px;
    background:linear-gradient(#8fc3ee,#cfe6f8);box-shadow:0 4px 12px rgba(120,80,40,.2);overflow:hidden}
  .fenster::before,.fenster::after{content:"";position:absolute;background:#fff}
  .fenster::before{left:50%;top:0;bottom:0;width:6px;transform:translateX(-50%)} .fenster::after{top:50%;left:0;right:0;height:6px;transform:translateY(-50%)}
  .lichterkette{position:fixed;z-index:0;top:4%;left:0;right:0;height:30px;text-align:center;font-size:16px;letter-spacing:6px;white-space:nowrap;overflow:hidden}
  .kranz{position:fixed;z-index:0;top:14%;left:10%;font-size:12vw;max-font-size:80px}
  .vorhang-seite{position:fixed;top:0;bottom:0;width:13%;z-index:7;pointer-events:none;background:repeating-linear-gradient(90deg,#b3202a 0 25%,#d6333d 25% 50%)}
  .vorhang-oben{position:fixed;top:0;left:0;right:0;height:7vh;z-index:7;pointer-events:none;background:#b3202a;border-bottom:6px solid #d4a017;border-radius:0 0 40% 40%/0 0 30px 30px}
  .stern{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff;z-index:0;animation:funkel 2.4s ease-in-out infinite}
  @keyframes funkel{50%{opacity:.2}}
  #endkarte{position:fixed;left:0;right:0;top:16%;z-index:8;text-align:center;color:#fff;font-weight:600;font-size:2.1rem;line-height:1.2;
    text-shadow:0 2px 16px rgba(255,200,120,.8);opacity:0;transform:scale(.8);transition:all 1.6s ease-out;pointer-events:none;padding:0 20px}
  #endkarte.show{opacity:1;transform:none}
  #raum,#raumboden{position:fixed;left:0;top:0;pointer-events:none}
  #raum{z-index:0} #raumboden{z-index:1}
  .rauch{animation:rauch 2.4s ease-in-out infinite} @keyframes rauch{50%{transform:translateY(-4px);opacity:.2}}
  .birne{animation:birne 1.8s ease-in-out infinite} @keyframes birne{50%{opacity:.15}}
  .flocke{animation:flocke linear infinite} @keyframes flocke{to{transform:translateY(var(--fh))}}
  .flamme{transform-box:fill-box;transform-origin:50% 100%;animation:flamme .6s ease-in-out infinite alternate} @keyframes flamme{to{transform:scale(.85,1.12) rotate(4deg)}}
  .pendel{animation:pendel 3s ease-in-out infinite} @keyframes pendel{50%{transform:rotate(8deg)}}
  #bea svg{animation:atmen 2.4s ease-in-out infinite} @keyframes atmen{50%{transform:scale(1.015,.985)}}
  .flammen{animation:spin 3s linear infinite, flackern .25s ease-in-out infinite alternate !important} @keyframes flackern{to{filter:brightness(1.3)}}
  .spot{position:fixed;top:0;bottom:15%;z-index:3;pointer-events:none;background:linear-gradient(180deg,rgba(255,245,200,.0),rgba(255,245,200,.45));clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);animation:birne 2.5s ease-in-out infinite}
  .krempelberg{position:fixed;left:-5%;right:-5%;bottom:18%;height:55%;z-index:1;pointer-events:none}
  .krempelberg span{position:absolute;opacity:0;animation:krempelpop .35s cubic-bezier(.3,1.6,.5,1) forwards}
  @keyframes krempelpop{from{opacity:0;translate:0 40px;scale:.3}to{opacity:1;translate:0 0;scale:1}}
  .gutschein{width:100%;height:100%;background:linear-gradient(135deg,#fffaf0,#f6e7c8);border:3px solid #d4a017;border-radius:10px;box-shadow:0 6px 16px rgba(0,0,0,.3);
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;color:#7a4a1e}
  .gutschein .g1{font-size:calc(var(--size)*.11);letter-spacing:2px} .gutschein .g2{font-size:calc(var(--size)*.1);color:#2b2420} .gutschein .g3{font-size:calc(var(--size)*.065)}
  #bye{position:fixed;left:0;right:0;top:38%;text-align:center;z-index:5;font-size:1.8rem;font-weight:600;color:#fff;
    text-shadow:0 2px 12px rgba(120,60,40,.35);opacity:0;transition:opacity 1.2s;pointer-events:none}
  #bye.show{opacity:1;pointer-events:auto}
  #bye small{display:block;font-size:.9rem;font-weight:500;opacity:.85;margin-top:6px}
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 400 240" preserveAspectRatio="xMidYMax slice"></svg>

<div id="actor"><div id="body">
<svg class="sun" viewBox="0 0 200 200" aria-label="Fröhliche Sonne">
  <defs><radialGradient id="g" cx="45%" cy="40%" r="65%">
    <stop offset="0%" stop-color="#ffe58a"/><stop offset="70%" stop-color="#ffc240"/><stop offset="100%" stop-color="#f7a62a"/>
  </radialGradient></defs>
  <g class="rays" id="rays"></g>
  <circle cx="100" cy="100" r="56" fill="url(#g)"/>
  <g class="eye"><ellipse cx="80" cy="94" rx="7.5" ry="9.5" fill="#3b2416"/><circle cx="82.5" cy="90.5" r="2.8" fill="#fff"/></g>
  <g class="eye"><ellipse cx="120" cy="94" rx="7.5" ry="9.5" fill="#3b2416"/><circle cx="122.5" cy="90.5" r="2.8" fill="#fff"/></g>
  <ellipse cx="66" cy="112" rx="10" ry="6.5" fill="#ff8a7a" opacity=".65"/>
  <ellipse cx="134" cy="112" rx="10" ry="6.5" fill="#ff8a7a" opacity=".65"/>
  <path d="M88 109 Q100 128 112 109 Z" fill="#8a3420" stroke="#8a3420" stroke-width="2" stroke-linejoin="round"/>
  <path d="M95 118 Q100 122 105 118" stroke="#ff7a6a" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Outfits -->
  <g class="acc" id="o-schal" style="display:none">
    <path d="M52 132 Q100 162 148 132 L150 146 Q100 176 50 146 Z" fill="var(--schal,#3f9b6b)"/>
    <path d="M70 146 L68 158 M88 152 L87 165 M112 152 L113 165 M130 146 L132 158" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <path d="M128 148 L140 190 L122 192 L116 152 Z" fill="var(--schal,#3f9b6b)"/>
  </g>
  <g class="acc" id="o-weihnachtsmuetze" style="display:none">
    <path d="M50 66 C50 32 76 12 106 13 C134 14 154 32 166 64 C158 50 148 42 136 40 C146 50 150 58 152 68 Z" fill="#e2483d"/>
    <path d="M70 30 C84 20 100 18 114 20" stroke="#f26b5f" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/>
    <path d="M46 70 Q100 46 156 70" stroke="#fff" stroke-width="17" fill="none" stroke-linecap="round"/>
    <path d="M52 74 Q100 54 150 74" stroke="#e9eef4" stroke-width="4" fill="none" stroke-linecap="round" opacity=".8"/>
    <circle cx="167" cy="68" r="11" fill="#fff"/><circle cx="163" cy="64" r="4" fill="#fff" opacity=".9"/>
    <circle cx="170" cy="72" r="5" fill="#eef2f6"/>
</g>
  <g class="acc" id="o-bommelmuetze" style="display:none">
    <path d="M44 76 C42 32 70 18 100 18 C130 18 158 32 156 76 Z" fill="#4a7bd0"/>
    <path d="M50 52 Q100 32 150 52" stroke="#fff" stroke-width="6" fill="none"/>
    <path d="M47 64 Q100 44 153 64" stroke="#ffd84a" stroke-width="4" fill="none"/>
    <path d="M42 78 Q100 56 158 78" stroke="#2f5fb3" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M42 78 Q100 56 158 78" stroke="#4a7bd0" stroke-width="12" fill="none" stroke-dasharray="2 5" opacity=".9"/>
    <circle cx="100" cy="17" r="13" fill="#fff"/><circle cx="91" cy="12" r="7" fill="#fff"/><circle cx="109" cy="12" r="7" fill="#fff"/><circle cx="100" cy="7" r="6" fill="#fff"/>
</g>
  <g class="acc" id="o-ohren" style="display:none">
    <path d="M48 98 Q50 30 100 30 Q150 30 152 98" fill="none" stroke="#c43a33" stroke-width="7"/>
    <circle cx="46" cy="102" r="15" fill="#fff"/><circle cx="154" cy="102" r="15" fill="#fff"/>
    <circle cx="46" cy="102" r="9" fill="#ffe3ea"/><circle cx="154" cy="102" r="9" fill="#ffe3ea"/>
  </g>
  <g class="acc" id="o-blumen" style="display:none"></g>
  <g class="acc" id="o-brille" style="display:none">
    <rect x="62" y="83" width="32" height="21" rx="9" fill="#2a1b40"/>
    <rect x="106" y="83" width="32" height="21" rx="9" fill="#2a1b40"/>
    <path d="M94 91 L106 91 M62 88 L50 84 M138 88 L150 84" stroke="#2a1b40" stroke-width="4" stroke-linecap="round"/>
    <path d="M69 88 L78 88 M113 88 L122 88" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  </g>
  <g class="acc" id="o-arme" style="display:none">
    <path d="M56 118 Q36 96 46 60" stroke="#ffb13d" stroke-width="10" fill="none" stroke-linecap="round"/><circle cx="47" cy="56" r="8" fill="#ffb13d"/>
    <path d="M144 118 Q164 96 154 60" stroke="#ffb13d" stroke-width="10" fill="none" stroke-linecap="round"/><circle cx="153" cy="56" r="8" fill="#ffb13d"/>
  </g>
  <g class="acc" id="o-muskeln" style="display:none">
    <path d="M56 116 Q24 110 30 70" stroke="#ffb13d" stroke-width="14" fill="none" stroke-linecap="round"/><circle cx="36" cy="96" r="16" fill="#ffb13d"/><circle cx="30" cy="62" r="11" fill="#ffb13d"/>
    <path d="M144 116 Q176 110 170 70" stroke="#ffb13d" stroke-width="14" fill="none" stroke-linecap="round"/><circle cx="164" cy="96" r="16" fill="#ffb13d"/><circle cx="170" cy="62" r="11" fill="#ffb13d"/>
    <path d="M28 92 q6 -6 12 0 M160 92 q6 -6 12 0" stroke="#e8962a" stroke-width="2" fill="none"/>

function Prop(name, art, w, h, cx, bottom, z=3){
  const d=document.createElement('div'); d.className='prop';
  d.innerHTML = PROPS_SVG[art] || PROPS_HTML[art] || `<div class="emo">${art}</div>`;
  d.style.width=w+'px'; d.style.height=h+'px'; d.style.zIndex=z;
  if(!PROPS_SVG[art] && !PROPS_HTML[art]) d.style.fontSize=(h*.9)+'px';
  document.body.appendChild(d);
  const p={el:d,x:cx,y:bottom,w,h,rot:0,s:1,o:1,flip:1}; prs[name]=p; setP(p); return p;
}
function setP(p){ p.el.style.transform=`translate(${p.x-p.w/2}px,${p.y-p.h}px) rotate(${p.rot}deg) scale(${p.s*p.flip},${p.s})`; p.el.style.opacity=p.o; }
function tw(dur,fn,ease=t=>t){return animiere(dur,t=>fn(ease(t)));}
const ein=t=>1-Math.pow(1-t,3), rein3=t=>t*t;

async function propTo(p,tx,ty,dur=600,arc=0,drehung=0){ const fx=p.x,fy=p.y,fr=p.rot;
  await tw(dur,t=>{p.x=fx+(tx-fx)*t; p.y=fy+(ty-fy)*t-arc*4*t*(1-t); p.rot=fr+drehung*t; setP(p);}); }

function lebendig(wer,t){
  if(LEB_AUS) return;
  if(wer==='sonne' && (rot!==0||sunS!==1)) return;
  if(wer==='bea' && (Math.abs(beaRot)>20||beaS!==1)) return;
  const txt=t.replace(/<[^>]+>/g,''), gross=(txt.match(/[A-ZÄÖÜ]/g)||[]).length, klein=(txt.match(/[a-zäöüß]/g)||[]).length;
  const lacht=/HAHA/i.test(txt), laut=/!!/.test(txt)||(gross>4&&gross>klein), frage=/\?\s*\S*$/.test(txt)&&!laut;
  if(wer==='sonne'){
    if(lacht){ (async()=>{ for(let i=0;i<3;i++){ if(hopping) break; await hop(x,H()*.035,220);} })(); funken(sunMx(),y-size*.8,4,['😂','✨'],.8); }

    else if(frage){ (async()=>{ await tw(250,t=>{rot=-9*t; place();}); await sleep(700); await tw(250,t=>{rot=-9*(1-t); place();}); })(); }

    if(lacht){ beaJump(); setTimeout(beaJump,450); funken(beaMx(),beaY-beaH*.9,4,['😂','✨'],.8); }

  }
}

document.documentElement.style.setProperty('--schal',schalFarbe);
((besonders&&besonders.outfit)||thema.sonne||pick(OUTFITS[saison])).forEach(o=>document.getElementById('o-'+o).style.display='');

/* ---------- Bewegung ---------- */
let size=190, beaH=0, beaW=0;
function updateSize(){
  size=Math.max(64,Math.min(W()*(SZ?.37:.42),H()*(SZ?.27:.3),SZ?175:190));
  document.documentElement.style.setProperty('--size',size+'px');
  { beaH=size*1.05; beaW=beaH*.6;
    document.documentElement.style.setProperty('--beah',beaH+'px');document.documentElement.style.setProperty('--beaw',beaW+'px'); }
}
updateSize();
const actor=document.getElementById('actor'), body=document.getElementById('body');
const bubble=document.getElementById('bubble'), tap=document.getElementById('tap');
const groundY=()=>H()*.80;
const bea=document.getElementById('bea');
updateSize();
const spur=[];
if(besonders && besonders.beaReveal) bea.style.opacity='0';
if(besonders && besonders.beaKostuem==='nikolaus'){
  document.getElementById('bea-nikolaus').style.display='';
  document.getElementById('bea-hut').style.display='';
  bea.querySelectorAll('.reif').forEach(e=>e.style.display='none');
  bea.querySelectorAll('.jacke').forEach(e=>e.setAttribute('fill','#e2483d'));
  bea.querySelectorAll('.aermel').forEach(e=>e.setAttribute('stroke','#e2483d'));
  bea.querySelectorAll('.cardigan').forEach(e=>e.setAttribute('fill','#fff'));
  document.getElementById('bea-mund').style.display='none';
}
const zeige=id=>document.getElementById(id).style.display='';
const ohneReif=()=>bea.querySelectorAll('.reif').forEach(e=>e.style.display='none');
if(!(besonders&&besonders.beaKostuem)){
  if(thema.bea==='hut'){zeige('bea-hut');ohneReif();}
  if(['beanie','ski','schlittschuh'].includes(thema.bea)){zeige('bea-beanie');ohneReif();}
  if(thema.bea==='ski'){zeige('bea-ski');zeige('bea-brille-ski');}
  if(thema.bea==='schlittschuh') zeige('bea-skates');
}
// Beas Klamotten wechseln jeden Tag 👕
const BEA_DRAUSSEN=['leder','puffer','teddy','hoodie-rot','puffer','teddy','hoodie-gruen'];
const BEA_DRINNEN=['hoodie-rot','hoodie-gruen','teddy','hoodie-rot','hoodie-gruen'];
function beaOutfit(tag, drinnen){
  const liste = drinnen?BEA_DRINNEN:BEA_DRAUSSEN;
  const o = tag===1 ? 'leder' : liste[tag%liste.length];
  const sleeve={ 'hoodie-rot':'#d64545','hoodie-gruen':'#3f8f5a','teddy':'#f4efe6','puffer':'#1f1f22' }[o];
  if(o.startsWith('hoodie')){ zeige('bea-top-hoodie'); const c=o==='hoodie-rot'?['#d64545','#a83232']:['#3f8f5a','#2e6b43'];
    bea.querySelectorAll('.top-farbe').forEach(e=>e.setAttribute('fill',c[0])); bea.querySelectorAll('.top-dunkel').forEach(e=>e.setAttribute('fill',c[1])); }
  if(o==='teddy') zeige('bea-top-teddy');
  if(o==='puffer') zeige('bea-top-puffer');
  if(sleeve) bea.querySelectorAll('.aermel').forEach(e=>e.setAttribute('stroke',sleeve));
  const schuh = tag%2 ? '#6b4226' : '#151212';
  bea.querySelectorAll('.schuh').forEach(e=>e.setAttribute('fill',schuh)); zeige('bea-sohle');
}
if(month===11 && dezTag && !(besonders&&besonders.beaKostuem)) beaOutfit(dezTag, !!(SZ && SZ.ort!=='draussen' && SZ.ort!=='nacht'));
let beaModus = (thema.bea==='ski'||thema.bea==='schlittschuh') ? 'auftritt' : 'folgen';
if(beaModus==='auftritt') bea.style.opacity='0';
let beaRot=0;
function folgen(now){
  spur.push({t:now,x,y}); while(spur.length>2&&spur[1].t<now-260) spur.shift();
  const p=spur[0];
  if(beaModus==='folgen'){ beaX=p.x-beaW*.78; beaY=p.y; bea.style.transform=`translate(${beaX}px,${beaY-beaH}px)`; }
  else if(beaModus==='frei') setBea();
  requestAnimationFrame(folgen);
}
requestAnimationFrame(folgen);
bea.addEventListener('pointerdown',()=>{
  if(untergegangen||SZ_AKTIV) return;
  bea.classList.remove('jump'); void bea.offsetWidth; bea.classList.add('jump');
  sprecher='bea'; setTimeout(()=>sprecher='sonne',2300);
  say(pick(['Hehe, das bin ich! 💛','Mini Bea sagt Hallo! 👋','Ich hab dich lieb! 💛','Ich bin immer bei dir, in klein. 🤏']),2200);
  planeUntergang(5000);
});
let x=-size, y=groundY(), hopping=false, rot=0, bubbleTimer, sprecher='sonne';

function place(){
  actor.style.transform=`translate(${x}px,${y-size}px) rotate(${rot}deg)`+(sunS!==1?` scale(${sunS})`:'');
  const bw=bubble.offsetWidth,bh=bubble.offsetHeight;
  const ax = sprecher==='bea' ? beaX+beaW/2 : x+size/2;
  const top = sprecher==='bea' ? beaY-beaH*1.28 : y-size*sunS;
  let bx=Math.max(10,Math.min(W()-bw-10,ax-bw/2));
  bubble.style.left=bx+'px'; bubble.style.top=Math.max(10,top-bh-8)+'px';
  bubble.style.setProperty('--tail',Math.max(24,Math.min(bw-24,ax-bx))+'px');
}
let hopId=0;
const weich=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function hop(toX,height=H()*.2,dur=620,salto=false){
  return new Promise(res=>{
    const id=++hopId; hopping=true; body.className='stretch';
    const fx=x,fy=y,boden=groundY()-sunHub,t0=performance.now();
    dur*=1.12;
    (function step(now){
      if(id!==hopId) return res();
      const t=Math.min(1,(now-t0)/dur), e=weich(t);
      x=fx+(toX-fx)*e; y=fy+(boden-fy)*e-height*4*t*(1-t); rot=salto?360*e*(toX<fx?-1:1):0;
      place();
      if(t<1) requestAnimationFrame(step);
      else{ rot=0; body.className='squash'; if(height>H()*.05) sparks(x+size/2,y,3,['✨']);
        setTimeout(()=>{ if(id===hopId){ body.className=''; hopping=false; } res(); },150); }
    })(t0);
  });
}
function say(html,ms){
  clearTimeout(bubbleTimer); bubble.innerHTML=html; bubble.classList.add('show'); place();
  if(ms) bubbleTimer=setTimeout(()=>bubble.classList.remove('show'),ms);
}
function sparks(cx,cy,n,emojis=['✨','💛','⭐','☀️'],weit=1){
  // nichts vor die Gesichter: Funken, die im Gesicht starten würden, beginnen über dem Kopf
  if(cx>x-10 && cx<x+size+10 && cy>y-size*1.05 && cy<y-size*.15) cy=y-size*1.05;
  if(typeof beaX!=='undefined' && cx>beaX-10 && cx<beaX+beaW+10 && cy>beaY-beaH*1.02 && cy<beaY-beaH*.45) cy=beaY-beaH*1.02;
  for(let i=0;i<n;i++){
    const s=document.createElement('div');s.className='spark';s.textContent=pick(emojis);
    s.style.left=cx+'px';s.style.top=(cy-20)+'px';
    s.style.setProperty('--dx',rnd(-90,90)*weit+'px');s.style.setProperty('--dy',(-rnd(40,130)*weit)+'px');
    s.style.setProperty('--rot',rnd(-180,180)+'deg');
    document.body.appendChild(s);setTimeout(()=>s.remove(),1100);
  }
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mitte=()=>W()/2-size/2;

const KONFETTI={winter:(besonders&&besonders.konfetti)||['❄️','✨','🎄','⭐'],fruehling:['🌸','🌷','🦋','✨'],sommer:['🍦','🌴','🏖️','✨'],herbst:['🍁','🍂','✨','🌰']};
const AKTIONEN={
  konfetti: async()=>{ for(let i=0;i<3;i++){sparks(x+size/2,y-size/2,10,KONFETTI[saison],1.6);await sleep(250);} },
  tanzen:   async()=>{ body.className='dance'; await sleep(2000); body.className=''; },
  salto:    async()=>{ await hop(x,H()*.3,800,true); sparks(x+size/2,y-size/2,10); },
  herzen:   async()=>{ for(let i=0;i<4;i++){sparks(x+size/2,y-size/2,5,['💛','🧡','❤️','💕'],1.3);await sleep(300);} }
};

async function auftritt(){
  place(); await sleep(400);
  const ziel=mitte(), n=4;
  for(let i=1;i<=n;i++) await hop(-size+(ziel+size)*i/n, H()*(.10+.04*i), 520);
  await hop(ziel,H()*.26,750);
  sparks(x+size/2,y-size/2,14);
  const gruss = hour<11?'Guten Morgen':hour<14?'Mahlzeit':hour<18?'Hallo':'Guten Abend';
  const slot  = hour<11?'morgen':hour<14?'mittag':hour<18?'nachmittag':'abend';
  const name  = KOSENAME?', '+KOSENAME:'';
  if(besonders && besonders.szene){
    for(const zeile of besonders.szene){
      if(zeile==='BEA'){
        bubble.classList.remove('show'); await sleep(300);
        bea.style.transition='opacity .3s'; bea.style.opacity='1';
        bea.classList.remove('jump'); void bea.offsetWidth; bea.classList.add('jump');
        sparks(x-size*.3,y-size*.5,16,['🎉','💛','✨']);
        await sleep(700); continue;
      }
      const istBea=zeile.startsWith('BEA:');
      sprecher = istBea ? 'bea' : 'sonne';
      say(istBea?zeile.slice(4):zeile,0);
      if(istBea){ bea.classList.remove('jump'); void bea.offsetWidth; bea.classList.add('jump'); } else AKTIONEN.konfetti();
      await sleep(Math.max(2600, zeile.length*55));
    }
    sprecher='sonne';
    setTimeout(()=>tap.classList.add('show'),1000);
    planeUntergang(3000); return;
  }
  if(besonders){
    say(`<big>${gruss}${name}! ☀️</big>${besonders.text}`,0);
    if(beaModus==='auftritt'){ beaAuftritt(); }
    AKTIONEN.konfetti(); setTimeout(()=>AKTIONEN.herzen(),900);
  } else {
    const zeile = (thema.spruch && Math.random()<.75) ? pick(thema.spruch) : Math.random()<.35 ? pick(SAISON_SPRUECHE[saison]) : pick(SPRUECHE[slot]);
    say(`<big>${gruss}${name}! ☀️</big>${zeile}`,0);
    await sleep(900);
    if(beaModus==='auftritt'){ await sleep(1500); await beaAuftritt(); }
    await pick(Object.values(AKTIONEN))();
  }
  setTimeout(()=>tap.classList.add('show'),2500);
  planeUntergang(7000);
}
async function beaAuftritt(){
  const zx=()=>x-beaW*.78, zy=()=>y;
  bea.style.opacity='1';
  if(thema.bea==='ski'){
    const sx=-beaW*1.2, sy=groundY()-H()*.32;
    await new Promise(res=>{const t0=performance.now();(function st(n){
      const t=Math.min(1,(n-t0)/2300), e=1-Math.pow(1-t,2);
      const bx=sx+(zx()-sx)*e, by=sy+(zy()-sy)*e - Math.sin(t*Math.PI*3)*8*(1-t);
      bea.style.transform=`translate(${bx}px,${by-beaH}px) rotate(${14*(1-t)}deg)`;
      if(Math.random()<.25) sparks(bx+beaW*.2,by,1,['❄️','💨'],.5);
      t<1?requestAnimationFrame(st):res();})(t0);});
    sprecher='bea'; say('Bahn freeei! ⛷️',1800); setTimeout(()=>sprecher='sonne',1900);
  } else {
    const sx=-beaW*1.2;
    await new Promise(res=>{const t0=performance.now();(function st(n){
      const t=Math.min(1,(n-t0)/2600), e=1-Math.pow(1-t,3);
      const bx=sx+(zx()-sx)*e, rot=Math.sin(t*Math.PI*4)*8*(1-t);
      bea.style.transform=`translate(${bx}px,${zy()-beaH}px) rotate(${rot}deg)`;
      t<1?requestAnimationFrame(st):res();})(t0);});
    // Pirouette
    await new Promise(res=>{const t0=performance.now();(function st(n){
      const t=Math.min(1,(n-t0)/900);
      bea.style.transform=`translate(${zx()}px,${zy()-beaH}px) scaleX(${Math.cos(t*Math.PI*4)})`;
      t<1?requestAnimationFrame(st):res();})(t0);});
    sparks(zx()+beaW/2,zy()-beaH/2,8,['✨','⛸️','⭐']);
    sprecher='bea'; say('Pirouette! ✨',1800); setTimeout(()=>sprecher='sonne',1900);
  }
  beaModus='folgen';
}
let untergegangen=false, untergangTimer;
function planeUntergang(ms){ clearTimeout(untergangTimer); untergangTimer=setTimeout(untergehen,ms); }
async function untergehen(){
  if(hopping){ return planeUntergang(800); }
  untergegangen=true; tap.classList.remove('show');
  say(pick(['Bis morgen, Salmi! 💛','Hab einen wunderschönen Tag! ☀️','Wir sehen uns morgen! 👋💛','Hab dich lieb! Bis morgen! 💛']),2200); beaWinkt(4500);
  await sleep(2300);
  if(!SZ) await hop(mitte(),H()*.12,520);
  actor.style.zIndex='0'; bea.style.zIndex='0'; document.getElementById('scene').style.zIndex='3';
  const rbd=document.getElementById('raumboden'); if(rbd) rbd.style.zIndex='3';
  document.getElementById('dusk').style.opacity='1';
  const y0=y,by0=beaY,t0=performance.now(),dur=2600;
  await new Promise(res=>{(function step(now){
    const t=Math.min(1,(now-t0)/dur), e=t*t;
    y=y0+(H()*.32+size)*e; rot=Math.sin(t*12)*4; place();
    if(beaModus==='frei'){ beaY=by0+(H()*.32+beaH)*e; beaRot=-Math.sin(t*12)*4; setBea(); }
    t<1?requestAnimationFrame(step):res();
  })(t0);});
  document.getElementById('bye').classList.add('show');
}
actor.addEventListener('pointerdown',async()=>{
  if(hopping||untergegangen||SZ_AKTIV) return;
  planeUntergang(5000);
  tap.classList.remove('show');
  say(pick(ANTIPPEN),2200);
  if(Math.random()<.3) await AKTIONEN.salto(); else { await hop(x,H()*.26,600); sparks(x+size/2,y-size/2,8); }
});
addEventListener('resize',()=>{updateSize(); if(!hopping&&!untergegangen){y=groundY();x=Math.min(x,W()-size);} place();});
addEventListener('hashchange',()=>location.reload());
document.getElementById('bye').addEventListener('click',()=>location.reload());

/* ---------- Diabetes-Kampf (#diabetes) ---------- */
const KAMPF_SPRUECHE_MONSTER=["Hehehe … ich bin's, DIABETES! 😈","Na? Hast du mich vermisst? 😈","Ich hab Zucker mitgebracht! 😈🍬"];
const KAMPF_SPRUECHE_SONNE=["DU schon wieder?! 😤","Nicht mit uns, Freundchen!","Bea, halt meine Mütze!"];
const KAMPF_SIEG=["Und bleib weg! 💪","Werte gecheckt ✅ Monster verprügelt ✅","Gut gemacht, du Held! 💪","Team Sonne gewinnt! 🏆","Wir passen auf dich auf! 💛"];
const BOOMS=["POW!","BAM!","ZACK!","KLATSCH!","BONK!","WUMMS!"];
const monster=document.getElementById('monster'), mbubble=document.getElementById('mbubble'), fight=document.getElementById('fight');
let mx=0,my=0,mrot=0,mscale=1;
const msize=()=>size*.95;
function placeMonster(){
  document.documentElement.style.setProperty('--msize',msize()+'px');
  monster.style.transform=`translate(${mx}px,${my-msize()}px) rotate(${mrot}deg) scale(${mscale})`;
  const bw=mbubble.offsetWidth,bh=mbubble.offsetHeight;
  mbubble.style.left=Math.max(10,Math.min(W()-bw-10,mx+msize()/2-bw/2))+'px';
  mbubble.style.top=Math.max(10,my-msize()-bh-10)+'px';
}
function animiere(dur,fn){return new Promise(res=>{const t0=performance.now();(function st(n){const t=Math.min(1,(n-t0)/dur);fn(t);t<1?requestAnimationFrame(st):res();})(t0);});}
async function monsterHop(toX,h=H()*.1,dur=480){const fx=mx;await animiere(dur,t=>{mx=fx+(toX-fx)*t;my=groundY()-h*4*t*(1-t);placeMonster();});}
function boom(cx,cy){const b=document.createElement('div');b.className='boom';b.textContent=pick(BOOMS);
  b.style.left=Math.max(8,Math.min(W()-170,cx+rnd(-90,20)))+'px';b.style.top=(cy+rnd(-90,10))+'px';b.style.setProperty('--r',rnd(-20,20)+'deg');
  document.body.appendChild(b);setTimeout(()=>b.remove(),750);}
async function kampf(){
  place(); monster.style.display='block';mx=W()+20;my=groundY();placeMonster();
  await sleep(400);
  const mZiel=W()-msize()-W()*.06;
  await monsterHop(W()-msize()*.6,H()*.08);await monsterHop(mZiel,H()*.08);
  mbubble.textContent=pick(KAMPF_SPRUECHE_MONSTER);mbubble.classList.add('show');placeMonster();
  await sleep(1600);
  // Sonne + Bea kommen
  for(let i=1;i<=2;i++) await hop(-size+(W()*.08+size)*i/2,H()*.14,480);
  mbubble.classList.remove('show');
  say(`<big>${pick(KAMPF_SPRUECHE_SONNE)}</big>`,1500);
  await sleep(1500);
  // Angriff!
  await hop(mZiel-size*.45,H()*.22,520);
  const fs=Math.max(size,msize())*1.9; document.documentElement.style.setProperty('--fsize',fs+'px');
  fight.style.left=(mZiel+msize()/2-fs/2-size*.2)+'px'; fight.style.top=(groundY()-fs*.8)+'px'; fight.style.display='block';
  actor.style.opacity=0; bea.style.opacity=0; monster.style.opacity=0;
  const fx=mZiel+msize()/2-size*.2, fy=groundY()-fs*.45;
  for(let i=0;i<9;i++){ boom(fx,fy); sparks(fx,fy,3,['⭐','💥','🦶','✊','💫'],1.4); await sleep(260); }
  fight.style.display='none'; actor.style.opacity=1; bea.style.opacity=1; monster.style.opacity=1;
  // Monster fliegt weg
  mbubble.textContent='ARGHHHH! 😵';mbubble.classList.add('show');
  x=mZiel-size*1.05; y=groundY(); place();
  const sx=mx,sy=my;
  await animiere(1100,t=>{mx=sx+W()*.5*t;my=sy-H()*.75*t+H()*.15*t*t;mrot=900*t;mscale=1-.75*t;placeMonster();});
  mbubble.classList.remove('show'); monster.style.display='none';
  sparks(W()-40,H()*.15,6,['✨','⭐']);
  // Sieg
  await hop(mitte(),H()*.26,700);
  sparks(x+size/2,y-size/2,14,['🏆','💪','✨','💛']);
  say(`<big>${pick(KAMPF_SIEG)}</big>`,0);
  bea.classList.remove('jump'); void bea.offsetWidth; bea.classList.add('jump');
  setTimeout(()=>tap.classList.add('show'),2000);
  planeUntergang(6000);
}
(async()=>{ for(let i=0;i<50 && (W()<120||H()<200);i++) await new Promise(r=>setTimeout(r,100));
  updateSize(); x=-size*1.6; y=groundY();
  if(SZ){
    SZ_AKTIV=true; beaModus='frei'; actor.style.transformOrigin='50% 100%';
    try{ await SZ.lauf(); }catch(e){ console.error(e); SZ_AKTIV=false; beaModus='folgen'; planeUntergang(3000); }
  } else (hash==='diabetes'?kampf:auftritt)(); })();
</script>
</body>
